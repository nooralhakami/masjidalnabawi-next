<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E4D3A" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="دليل الزوار" />
    <meta name="description" content="خريطة تفاعلية للبوابات ودورات المياه والمواقف والخدمات حول المسجد النبوي، بحث سريع ومسارات مشي بـ26 لغة." />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <script>
      /* Start downloading the first satellite tiles before any JS loads, as the live app does: the same
         fit (outer-gate bounds, 16 px padding, Leaflet zoom 14–19). MapLibre asks for the very same tile
         URLs at that view (its zoom is one less, its 256 px raster tiles one level up), with fetch() in
         CORS mode, so the preload is a CORS fetch too. tests/unit/map-zoom.test.ts checks the bounds. */
      (function () {
        try {
          if (/[?&]poi=/.test(location.search)) return;
          var S = 24.4660176, N = 24.4710527, W = 39.6077755, E = 39.6142706, pad = 32, ts = 256;
          var w = innerWidth, h = innerHeight;
          function px(lat, lng, z) {
            var s = ts * Math.pow(2, z), r = (lat * Math.PI) / 180;
            return [((lng + 180) / 360) * s, (0.5 - Math.log((1 + Math.sin(r)) / (1 - Math.sin(r))) / (4 * Math.PI)) * s];
          }
          var a = px(N, W, 0), b = px(S, E, 0);
          var scale = Math.min((w - pad) / (b[0] - a[0]), (h - pad) / (b[1] - a[1]));
          var z = Math.max(14, Math.min(19, Math.floor(Math.log(scale) / Math.LN2)));
          var nw = px(N, W, z), se = px(S, E, z), cx = (nw[0] + se[0]) / 2, cy = (nw[1] + se[1]) / 2;
          for (var y = Math.floor((cy - h / 2) / ts); y <= Math.floor((cy + h / 2) / ts); y++)
            for (var x = Math.floor((cx - w / 2) / ts); x <= Math.floor((cx + w / 2) / ts); x++) {
              var l = document.createElement('link');
              l.rel = 'preload';
              l.as = 'fetch';
              l.crossOrigin = 'anonymous';
              l.setAttribute('fetchpriority', 'high');
              l.href = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x;
              document.head.appendChild(l);
            }
        } catch (e) {}
      })();
    </script>
    <title>الخريطة — دليل زوار المسجد النبوي</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/map-main.tsx"></script>
  </body>
</html>
